# Formatting is owned by swift-format (.swift-format). SwiftLint checks code quality.
included:
  - Hem
  - HemTests

# Rules that conflict with swift-format's output.
disabled_rules:
  - opening_brace
  - trailing_comma

opt_in_rules:
  - empty_count
  - first_where
  - contains_over_first_not_nil
  - last_where
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
  - weak_delegate

identifier_name:
  min_length: 1

line_length: 120

type_body_length:
  warning: 350
  error: 500

file_length:
  warning: 500
  error: 800
